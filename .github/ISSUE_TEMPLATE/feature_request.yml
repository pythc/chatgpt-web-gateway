name: Feature request / 功能建议
description: Propose one scoped improvement with an acceptance criterion.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem and current workaround
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed scope and alternatives
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance criteria
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Scope
      options:
        - label: I checked existing requests and backend limits and included no private information.
          required: true
