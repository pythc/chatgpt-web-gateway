name: Publish preview release
"on":
  push:
    tags: ["v[0-9]*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'pythc/chatgpt-web-gateway'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]]
          test "$(cat version.txt)" = "${TAG#v}"
          test -f "docs/releases/${TAG#v}.md"
          git merge-base --is-ancestor HEAD origin/main
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/releases.json
          python -c 'import json,os; assert not any(r["tag_name"] == os.environ["TAG"] for r in json.load(open("/tmp/releases.json"))), "Release already exists; choose a new version"'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/check_docs.py
      - run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - run: python scripts/test.py
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build versioned images
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/pythc/chatgpt-web-gateway:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/pythc/chatgpt-web-gateway
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
      - name: Qualify published digest on both architectures
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" --network none --entrypoint python "ghcr.io/pythc/chatgpt-web-gateway@$DIGEST" scripts/test.py
            docker run --rm --platform "$platform" --network none --entrypoint python "ghcr.io/pythc/chatgpt-web-gateway@$DIGEST" scripts/smoke_image.py
          done
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cp "docs/releases/${TAG#v}.md" /tmp/release-notes.md
          python - <<'PYNOTES'
          import os
          with open('/tmp/release-notes.md', 'a') as notes:
              notes.write('\n## Publication receipt\n\n')
              notes.write('Source commit: `' + os.environ['GITHUB_SHA'] + '`\n\n')
              notes.write('Image: `ghcr.io/pythc/chatgpt-web-gateway@' + os.environ['DIGEST'] + '`\n\n')
              notes.write('Architectures: Linux amd64 and arm64. Both image digests passed offline regressions and synthetic HTTP startup.\n')
          PYNOTES
          gh release create "$TAG" --verify-tag --prerelease --title "ChatGPT Web Gateway ${TAG#v} preview" --notes-file /tmp/release-notes.md
