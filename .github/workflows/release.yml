name: Publish preview release
"on":
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing preview tag to qualify without rebuilding
        required: true
        default: v0.1.0
      digest:
        description: Existing GHCR index digest (sha256) from the failed build
        required: true
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'pythc/chatgpt-web-gateway'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ env.RELEASE_TAG }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source
        id: source
        env:
          TAG: ${{ env.RELEASE_TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]]
          test "$(cat version.txt)" = "${TAG#v}"
          test -f "docs/releases/${TAG#v}.md"
          git merge-base --is-ancestor HEAD origin/main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/releases.json
          python -c 'import json,os; assert not any(r["tag_name"] == os.environ["TAG"] for page in json.load(open("/tmp/releases.json")) for r in page), "Release already exists; choose a new version"'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/check_docs.py
      - run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - run: python scripts/test.py
      - if: github.event_name != 'workflow_dispatch'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build versioned images
        if: github.event_name != 'workflow_dispatch'
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/pythc/chatgpt-web-gateway:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/pythc/chatgpt-web-gateway
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=MIT
      - name: Validate immutable index
        id: index
        env:
          DIGEST: ${{ steps.image.outputs.digest || inputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          image=ghcr.io/pythc/chatgpt-web-gateway
          test "$(docker buildx imagetools inspect "$image:$RELEASE_TAG" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
  qualify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Anonymous image qualification on native architecture
        env:
          DIGEST: ${{ needs.prepare.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          image=ghcr.io/pythc/chatgpt-web-gateway
          docker buildx imagetools inspect "$image@$DIGEST" --raw > /tmp/image-index.json
          manifest=$(python3 - <<'PYPLATFORM'
          import json, os, re
          manifests = json.load(open('/tmp/image-index.json'))['manifests']
          matches = [m for m in manifests if m.get('platform', {}).get('os') == 'linux' and m['platform'].get('architecture') == os.environ['ARCH']]
          assert len(matches) == 1, 'Expected exactly one image for the native architecture'
          digest = matches[0]['digest']
          assert re.fullmatch(r'sha256:[a-f0-9]{64}', digest)
          print(digest)
          PYPLATFORM
          )
          docker run --rm --platform "linux/$ARCH" --network none --entrypoint python "$image@$manifest" scripts/test.py
          docker run --rm --platform "linux/$ARCH" --network none --entrypoint python "$image@$manifest" scripts/smoke_image.py
  publish:
    needs: [prepare, qualify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DIGEST: ${{ needs.prepare.outputs.digest }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          cp "docs/releases/${TAG#v}.md" /tmp/release-notes.md
          python - <<'PYNOTES'
          import os
          with open('/tmp/release-notes.md', 'a') as notes:
              notes.write('\n## Publication receipt\n\n')
              notes.write('Source commit: `' + os.environ['SOURCE_COMMIT'] + '`\n\n')
              notes.write('Image: `ghcr.io/pythc/chatgpt-web-gateway@' + os.environ['DIGEST'] + '`\n\n')
              notes.write('Architectures: Linux amd64 and arm64. Both image digests passed offline regressions and synthetic HTTP startup.\n')
          PYNOTES
          gh release create "$TAG" --verify-tag --prerelease --title "ChatGPT Web Gateway ${TAG#v} preview" --notes-file /tmp/release-notes.md
