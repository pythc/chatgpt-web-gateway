name: Offline regression tests
"on": [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache tokenizer for offline tests
        run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - run: python scripts/check_docs.py
      - run: python scripts/test.py
      - name: Build runtime image
        run: docker build -t gateway-ci .
      - name: Offline image packaging and HTTP startup
        run: docker run --rm --network none --entrypoint python gateway-ci scripts/smoke_image.py
